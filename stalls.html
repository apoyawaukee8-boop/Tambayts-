        <div class="food-detail-photo" id="food-detail-photo"></div>
        <div class="food-detail-copy">
          <p class="food-detail-stall" id="food-detail-stall"></p>
          <h2 id="food-detail-name"></h2>
          <strong class="food-detail-price" id="food-detail-price"></strong>
          <p class="food-detail-description" id="food-detail-description"></p>
        </div>
        <div class="food-detail-actions">
          <div class="food-detail-quantity" aria-label="Choose quantity"><button type="button" id="food-detail-decrease" aria-label="Decrease quantity">−</button><output id="food-detail-count" aria-live="polite">1</output><button type="button" id="food-detail-increase" aria-label="Increase quantity">+</button></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
