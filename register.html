<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f3">
    <title>TamBayts | Create Account</title>
    <link rel="icon" type="image/png" sizes="128x128" href="images/feu-roosevelt-favicon.png?v=20261103-1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/auth.css?v=20261110-2">
  </head>
  <body class="register-page auth-light">
    <main class="auth-shell" id="top">
      <a class="brand" href="#top" aria-label="TamBayts"><img class="brand-mark" src="images/feu-roosevelt-logo.png?v=20261103-1" alt="FEU Roosevelt Cainta logo">TamBayts</a>

      <section class="auth-card">
        <p class="eyebrow">STUDENT ACCOUNT</p>
        <h1>Create your account</h1>
        <p class="subhead">Use your account to place orders and follow their status.</p>

        <form id="register-form" autocomplete="off">
          <label>
            <span>Full name <span class="required-mark" aria-hidden="true">*</span></span>
            <input
              name="name"
              autocomplete="off"
              maxlength="120"
              placeholder="Your name"
              required
            >
          </label>
          <label>
            <span>School email <span class="required-mark" aria-hidden="true">*</span></span>
            <input
              name="accountEmail"
              type="text"
              inputmode="email"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              data-no-autofill
              readonly
              pattern="[^\s@]+@[^\s@]+\.[^\s@]+"
              title="Enter a valid email address."
              placeholder="you@gmail.com"
              required
            >
          </label>
          <label>
            Gender <small>Optional</small>
            <select name="gender">
              <option value="">Choose gender (optional)</option>
              <option value="Man">Man</option>
              <option value="Woman">Woman</option>
              <option value="Non-binary">Non-binary</option>
              <option value="Prefer not to disclose">Prefer not to disclose</option>
            </select>
          </label>
          <label>
            Department <small>Optional</small>
            <select name="department" id="student-department">
              <option value="">Choose a department</option>
              <option value="Junior High School">Junior High School</option>
              <option value="Senior High School">Senior High School</option>
              <option value="Tertiary Education">Tertiary Education</option>
            </select>
          </label>
          <label id="student-grade-field" style="display:none">
            Grade level <small>Optional</small>
            <select id="student-grade" disabled>
              <option value="">Choose a grade</option>
            </select>
          </label>
          <label id="student-program-field" style="display:none">
            <span id="student-program-label">Strand</span> <small>Optional</small>
            <select id="student-program" disabled>
              <option value="">Choose a strand</option>
            </select>
          </label>
          <input type="hidden" name="course" id="student-course">
          <label>
            <span>Password <span class="required-mark" aria-hidden="true">*</span></span>
            <div class="password-row">
              <input name="password" type="password" autocomplete="off" minlength="8" placeholder="At least 8 characters" required>
              <button type="button" class="reveal is-hidden" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle class="eye-pupil" cx="12" cy="12" r="2.5"></circle><path class="eye-slash" d="m4 4 16 16"></path></svg>
              </button>
            </div>
          </label>

          <p class="form-error" id="auth-error" role="alert"></p>
          <button class="submit-button" type="submit">
            Create student account <span>→</span>
          </button>
        </form>

        <p class="auth-footer">
          Already registered? <a href="login.html">Sign in</a>
        </p>
      </section>

    </main>

    <script src="js/auth.js?v=20261116-3"></script>
  </body>
</html>
